<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LaMI Lab interaction network</title>
  <desc id="desc">An abstract network of connected groups representing collaboration, interaction, and collective decision-making.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18211d"/>
      <stop offset=".55" stop-color="#30463b"/>
      <stop offset="1" stop-color="#725f55"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d8e7d8" stop-opacity=".72"/>
      <stop offset="1" stop-color="#d8e7d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1220" cy="180" r="310" fill="url(#glow)" filter="url(#blur)" opacity=".45"/>
  <circle cx="410" cy="760" r="360" fill="#b89783" opacity=".13" filter="url(#blur)"/>
  <g fill="none" stroke="#dbe7df" stroke-width="3" opacity=".3">
    <path d="M235 618 470 430 710 555 930 315 1185 455 1390 245"/>
    <path d="M470 430 600 215 930 315 1070 690 710 555 500 745 235 618"/>
    <path d="M930 315 1185 455 1070 690 1350 720"/>
  </g>
  <g fill="#dce9df" stroke="#ffffff" stroke-width="4">
    <circle cx="235" cy="618" r="20"/><circle cx="470" cy="430" r="30"/><circle cx="710" cy="555" r="24"/>
    <circle cx="930" cy="315" r="38"/><circle cx="1185" cy="455" r="27"/><circle cx="1390" cy="245" r="18"/>
    <circle cx="600" cy="215" r="21"/><circle cx="1070" cy="690" r="32"/><circle cx="500" cy="745" r="18"/><circle cx="1350" cy="720" r="20"/>
  </g>
  <g fill="#c7a995" opacity=".9">
    <circle cx="930" cy="315" r="15"/><circle cx="470" cy="430" r="11"/><circle cx="1070" cy="690" r="12"/>
  </g>
</svg>
