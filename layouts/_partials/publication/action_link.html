{{- $url := .url | default "" -}}
{{- $filename := .filename | default "" -}}
{{- $active := or $url $filename -}}
{{- if $filename -}}
  <button class="hb-attachment-link hb-attachment-link-small js-cite-clipboard cursor-pointer" type="button" data-filename="{{ $filename }}">
{{- else if $url -}}
  <a class="hb-attachment-link hb-attachment-link-small" href="{{ $url }}" target="_blank" rel="noopener">
{{- else -}}
  <span class="hb-attachment-link hb-attachment-link-small publication-action-disabled" aria-disabled="true">
{{- end -}}

{{- if eq .icon "cite" -}}
  <svg style="height:1em" class="inline-block" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75A1.125 1.125 0 013.75 20.625V7.875c0-.621.504-1.125 1.125-1.125H6.75m9 10.375h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v12.75c0 .621.504 1.125 1.125 1.125h6.375z"/></svg>
{{- else if eq .icon "pdf" -}}
  <svg style="height:1em" class="inline-block" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.5 14.25v-2.625A3.375 3.375 0 0016.125 8.25h-1.5A1.125 1.125 0 0113.5 7.125v-1.5A3.375 3.375 0 0010.125 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9M8.25 15h7.5m-7.5 3H12"/></svg>
{{- else -}}
  <svg style="height:1em" class="inline-block" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244"/></svg>
{{- end }}
  <span>{{ .label }}</span>
{{- if $filename -}}
  </button>
{{- else if $url -}}
  </a>
{{- else -}}
  </span>
{{- end -}}
